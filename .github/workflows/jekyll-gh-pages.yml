name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.48.0

      - name: Run markdownlint on source files
        run: markdownlint src/*.md --config .markdownlint.json

      - name: Install lychee (link checker)
        run: |
          archive="$RUNNER_TEMP/lychee.tar.gz"
          extract_dir="$RUNNER_TEMP/lychee"
          mkdir -p "$extract_dir"
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz -o "$archive"
          tar -xzf "$archive" -C "$extract_dir" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          sudo install -m 0755 "$extract_dir/lychee" /usr/local/bin/lychee

      - name: Check links in source files
        run: lychee src/*.md --config .lycheerc.toml
        continue-on-error: true

      - name: Build web resume
        uses: abhinav/stitchmd-action@v2
        with:
          mode: write
          version: v0.9.0
          summary: src/RESUME.md
          output: README.md
          preface: src/Header.md
          offset: 1

      - name: Build ATS resume source
        uses: abhinav/stitchmd-action@v2
        with:
          mode: write
          version: v0.9.0
          summary: src/RESUME_ATS.md
          output: RESUME_ATS.md
          preface: src/Header.md
          offset: 1
          no-toc: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pandoc wkhtmltopdf

      - name: Convert ATS Markdown to HTML
        run: >-
          pandoc RESUME_ATS.md
          --output RESUME_ATS.html
          --standalone
          --section-divs
          --css src/PDF_ATS.css
          --metadata lang=en
          --variable pagetitle="Victor Witkamp - Resume"

      - name: Convert ATS HTML to PDF
        run: >-
          wkhtmltopdf
          --enable-local-file-access
          --title "Victor Witkamp - Resume"
          --page-size A4
          --orientation Portrait
          --margin-top 15mm
          --margin-bottom 15mm
          --margin-left 15mm
          --margin-right 15mm
          RESUME_ATS.html
          Victor-Witkamp-Resume-ATS.pdf

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Fix permissions for _site directory
        run: sudo chown -R $(id -u):$(id -g) _site

      - name: Copy PDF files to site
        run: |
          cp Victor-Witkamp-Resume-ATS.pdf _site/Victor-Witkamp-Resume-ATS.pdf
          cp Victor-Witkamp-Resume-ATS.pdf _site/RESUME.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
